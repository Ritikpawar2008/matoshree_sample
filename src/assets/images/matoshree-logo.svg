<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="35%" stop-color="#C99A3D" />
      <stop offset="70%" stop-color="#F2DE9C" />
      <stop offset="100%" stop-color="#9C7221" />
    </linearGradient>

    <!-- Deep Maroon Glow -->
    <radialGradient id="royalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C99A3D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C99A3D" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon Left (x: 10 to 110) -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <!-- Subtle Background Aura -->
    <circle cx="50" cy="52" r="48" fill="url(#royalGlow)" />

    <!-- Outer Decorative Arch -->
    <path d="M 50 8 C 22 8 8 28 8 54 C 8 80 28 98 50 102 C 72 98 92 80 92 54 C 92 28 78 8 50 8 Z" 
          stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.85" />
    
    <!-- Inner Arch Contour -->
    <path d="M 50 14 C 26 14 14 32 14 54 C 14 76 32 92 50 96 C 68 92 86 76 86 54 C 86 32 74 14 50 14 Z" 
          stroke="url(#goldGrad)" stroke-width="0.9" fill="none" stroke-dasharray="3,2" opacity="0.7" />

    <!-- Sacred Kalash & Chhatri Top Crest -->
    <path d="M 50 2 L 53 8 L 47 8 Z" fill="url(#goldGrad)" />
    <circle cx="50" cy="2" r="2.2" fill="url(#goldGrad)" />

    <!-- Royal Lotus Petals (Center) -->
    <!-- Center petal -->
    <path d="M 50 32 C 46 44 46 58 50 68 C 54 58 54 44 50 32 Z" fill="url(#goldGrad)" />
    <!-- Left petal 1 -->
    <path d="M 48 36 C 38 46 36 60 46 69 C 45 57 47 46 48 36 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Right petal 1 -->
    <path d="M 52 36 C 62 46 64 60 54 69 C 55 57 53 46 52 36 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Outer left petal -->
    <path d="M 44 44 C 28 54 30 70 42 72 C 38 62 40 52 44 44 Z" fill="url(#goldGrad)" opacity="0.75" />
    <!-- Outer right petal -->
    <path d="M 56 44 C 72 54 70 70 58 72 C 62 62 60 52 56 44 Z" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Base Floral Pedestal / Diya Base -->
    <path d="M 28 74 Q 50 82 72 74 Q 66 84 50 86 Q 34 84 28 74 Z" fill="url(#goldGrad)" />
    <circle cx="50" cy="88" r="2" fill="url(#goldGrad)" />

    <!-- Traditional Flank Flourishes -->
    <path d="M 22 52 Q 16 42 22 36 Q 26 44 24 54" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />
    <path d="M 78 52 Q 84 42 78 36 Q 74 44 76 54" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />
  </g>

  <!-- Typography Right (x: 125 to 500) -->
  <g transform="translate(126, 0)">
    <!-- Devanagari Script (Regal Traditional Heading) -->
    <text x="0" y="38" 
          font-family="'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Cinzel', serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="2.5" 
          fill="url(#goldGrad)">
      ॥ मातोश्री लॉन्स ॥
    </text>

    <!-- English Brand Title (Grand Classic Serif) -->
    <text x="0" y="70" 
          font-family="'Playfair Display', 'Cinzel', 'Cinzel Decorative', Georgia, serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#FFFFFF">
      MATOSHREE
      <tspan fill="url(#goldGrad)" font-weight="600"> LAWNS</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="94" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#E5C378" 
          opacity="0.9">
      LUXURY WEDDING DESTINATION • PUNE
    </text>

    <!-- Antique Gold Separator Line -->
    <line x1="0" y1="104" x2="340" y2="104" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
    <circle cx="170" cy="104" r="2" fill="url(#goldGrad)" />
  </g>
</svg>
